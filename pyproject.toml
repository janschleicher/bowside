[build-system]
requires = [
    "hatchling",
    "hatch-vcs",
]
build-backend = "hatchling.build"

[project]
name = "bowside"
dynamic = ["version"]
description = "GRN-driven differential equation modeling of cell differentiation."
readme = "README.md"
license = { text = "GPL-3.0 license" }
requires-python = ">=3.10"

authors = [
    { email = "jan.schleicher@uni-tuebingen.de" },
    { name = "Jan T. Schleicher" },
]

keywords = ["scRNA-seq", "SDE", "GRN", "dynamics"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Operating System :: MacOS",
    "Operating System :: Unix",
]

dependencies = [
    "tqdm",
    "numpy<2.4",
    "pandas<3.0",
    "matplotlib",
    "seaborn",
    "networkx",
    "scikit-learn",
    "scanpy>=1.10",
    "scvelo",
    "torch",
    "torchdiffeq",
    "torchsde",
    "geomloss",
]

[project.urls]
Repository = "https://github.com/janschleicher/bowside"

[project.optional-dependencies]
dev = ["ruff", "pytest"]
doc = [
    "sphinx",
    "sphinx-book-theme",
    "sphinx-copybutton",
    "sphinx-autoapi",
    "scanpydoc",
    "myst-parser",
]
opt = ["optuna", "optuna-dashboard"]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Same as Black.
line-length = 88
indent-width = 4

# Assume Python 3.12.
target-version = "py312"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
select = ["E4", "E7", "E9", "F"]
ignore = []

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
docstring-code-format = true

[tool.hatch.build.targets.wheel]
packages = ["src/bowside"]
[tool.hatch.version]
source = "vcs"

[tool.coverage.run]
omit = ["*/tests/*"]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]
